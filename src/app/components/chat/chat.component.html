<div class="chat-container" role="main">
  <!-- Header -->
  <header class="chat-header" role="banner">
    <div class="header-content">
      <h1 id="chat-title">AI Chatbot Assistant</h1>
      <p aria-label="Powered by Google Gemini AI">Powered by Google Gemini</p>
    </div>
    <button
      class="clear-btn"
      (click)="clearChat()"
      [disabled]="messages.length === 0"
      aria-label="Clear all chat messages"
      [attr.aria-disabled]="messages.length === 0"
      type="button">
      Clear Chat
    </button>
  </header>

  <!-- Messages Area -->
  <section
    class="messages-container"
    #messagesContainer
    role="log"
    aria-live="polite"
    aria-atomic="false"
    aria-labelledby="chat-title"
    aria-relevant="additions">
    <div *ngIf="messages.length === 0" class="empty-state" role="status">
      <h2>Welcome!</h2>
      <p>Start a conversation by typing a message below.</p>
    </div>

    <app-message
      *ngFor="let message of messages; trackBy: trackByMessageId"
      [message]="message"
      role="article">
    </app-message>

    <div *ngIf="isLoading" class="loading-indicator" role="status" aria-live="polite">
      <div class="typing-dots" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <span>AI is typing...</span>
    </div>

    <div *ngIf="error" class="error-message" role="alert" aria-live="assertive">
      <span aria-hidden="true">⚠️</span> {{ error }}
    </div>
  </section>

  <!-- Input Area -->
  <form class="input-container" (submit)="sendMessage(); $event.preventDefault()" role="form">
    <label for="user-message-input" class="visually-hidden">Type your message</label>
    <textarea
      id="user-message-input"
      [(ngModel)]="userInput"
      name="userMessage"
      (keypress)="onKeyPress($event)"
      placeholder="Type your message here..."
      [disabled]="isLoading"
      rows="3"
      aria-label="Type your message to the AI chatbot"
      aria-required="true"
      [attr.aria-invalid]="!userInput.trim() && userInput.length > 0">
    </textarea>
    <button
      type="submit"
      (click)="sendMessage()"
      [disabled]="!userInput.trim() || isLoading"
      class="send-btn"
      aria-label="Send message to AI chatbot"
      [attr.aria-busy]="isLoading">
      {{ isLoading ? 'Sending...' : 'Send' }}
    </button>
  </form>

  <!-- Footer -->
  <footer class="chat-footer" role="contentinfo">
    <p>Developed by <strong>Akhil Narayanoju</strong></p>
  </footer>
</div>
